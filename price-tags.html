<!doctype html>
<html lang="lo" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Tags</title>
<style>
/* ═══ shadcn/ui neutral tokens (the base blocks.so is built on) ═══ */
:root{
  --radius:0.625rem;
  --r-sm:calc(var(--radius) - 4px);
  --r-md:calc(var(--radius) - 2px);
  --r-lg:var(--radius);
  --r-xl:calc(var(--radius) + 4px);

  --background:#ffffff; --foreground:#0a0a0a;
  --card:#ffffff;       --card-foreground:#0a0a0a;
  --primary:#171717;    --primary-foreground:#fafafa;
  --secondary:#f5f5f5;  --secondary-foreground:#171717;
  --muted:#f5f5f5;      --muted-foreground:#737373;
  --accent:#f5f5f5;     --accent-foreground:#171717;
  --destructive:#e7000b;
  --border:#e5e5e5;     --input:#e5e5e5;
  --ring:#a1a1a1;       --ring-a:rgba(161,161,161,.5);
  --sidebar:#fafafa;    --sidebar-border:#e5e5e5;
  --primary-hover:#2e2e2e;

  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);

  --ui-font:'Geist','Geist Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,
    'Noto Sans Lao','Phetsarath OT','Noto Sans Thai','Noto Sans SC','PingFang SC',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  /* tag typography stays on the Google Sans stack */
  --tag-font:'Google Sans','Google Sans Text','Product Sans',
    -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',
    'Noto Sans Lao','Phetsarath OT','Saysettha OT','Lao UI',
    'Noto Sans Thai','Leelawadee UI','Noto Sans Khmer','Khmer OS',
    'Noto Sans Myanmar','Padauk','Noto Sans Arabic','Geeza Pro',
    'Noto Sans Devanagari','Nirmala UI','Noto Sans SC','PingFang SC','Microsoft YaHei',
    'Noto Sans TC','PingFang TC','Noto Sans JP','Hiragino Sans',
    'Noto Sans KR','Malgun Gothic',sans-serif;

  /* tag colors — user editable */
  --c-brand:#8b8b8b; --c-model:#1a1a1a; --c-spec:#5a5a5a; --c-price:#111111;
  --c-meta:#9a9a9a;  --c-rule:#d4d4d4;  --c-contact:#2f2f2f; --c-bg:#ffffff;
  --fs:1;
}
[data-theme=dark]{
  --background:#0a0a0a; --foreground:#fafafa;
  --card:#171717;       --card-foreground:#fafafa;
  --primary:#e5e5e5;    --primary-foreground:#171717;
  --secondary:#262626;  --secondary-foreground:#fafafa;
  --muted:#262626;      --muted-foreground:#a1a1a1;
  --accent:#404040;     --accent-foreground:#fafafa;
  --destructive:#ff6467;
  --border:rgba(255,255,255,.10); --input:rgba(255,255,255,.15);
  --ring:#737373;       --ring-a:rgba(115,115,115,.5);
  --sidebar:#171717;    --sidebar-border:rgba(255,255,255,.10);
  --primary-hover:#cdcdcd;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--ui-font);font-size:14px;line-height:1.45;
  background:var(--background);color:var(--foreground);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
svg{display:block}

/* ═══ primitives ═══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  height:36px;padding:0 16px;border-radius:var(--r-md);
  font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;
  border:1px solid transparent;background:transparent;
  transition:background-color .15s,color .15s,border-color .15s;
}
.btn:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-a)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-default{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-xs)}
.btn-default:hover{background:var(--primary-hover)}
.btn-outline{border-color:var(--border);background:var(--background);box-shadow:var(--shadow-xs)}
.btn-outline:hover{background:var(--accent);color:var(--accent-foreground)}
.btn-ghost:hover{background:var(--accent);color:var(--accent-foreground)}
.btn-destructive{color:var(--destructive);border-color:var(--border);box-shadow:var(--shadow-xs)}
.btn-destructive:hover{background:var(--destructive);color:#fff;border-color:var(--destructive)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-icon{width:36px;height:36px;padding:0}
.btn-icon svg{width:16px;height:16px}

.label{display:block;font-size:14px;font-weight:500;line-height:1;margin-bottom:6px;color:var(--foreground)}
.input,.select{
  display:block;width:100%;height:36px;padding:0 12px;
  border:1px solid var(--input);border-radius:var(--r-md);
  background:var(--background);color:var(--foreground);
  font-size:14px;box-shadow:var(--shadow-xs);min-width:0;
  transition:border-color .15s,box-shadow .15s;
}
.select{
  padding-right:30px;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23737373' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:15px;
}
.input:focus,.select:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-a)}
.input::placeholder,table.tbl .cell::placeholder{color:var(--muted-foreground);opacity:.65}

.card{
  background:var(--card);color:var(--card-foreground);
  border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);
}
.card-head{display:flex;align-items:flex-start;gap:16px;padding:20px 24px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.card-desc{font-size:13px;color:var(--muted-foreground);margin-top:5px}
.card-head .grow{flex:1 1 auto;min-width:0}
.card-body{padding:0 24px 20px}
.sep{height:1px;background:var(--border);border:0;margin:0}

/* ═══ layout ═══ */
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:300px;flex:0 0 300px;background:var(--sidebar);
  border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--sidebar-border)}
.sb-mark{
  width:32px;height:32px;flex:0 0 auto;border-radius:var(--r-md);
  background:var(--primary);color:var(--primary-foreground);
  display:flex;align-items:center;justify-content:center;
}
.sb-mark svg{width:17px;height:17px}
.sb-name{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sb-sub{font-size:12px;color:var(--muted-foreground);line-height:1.3;margin-top:1px}
.sb-scroll{flex:1 1 auto;overflow-y:auto;padding:8px 0 16px}
.sb-group{padding:12px 16px}
.sb-group + .sb-group{border-top:1px solid var(--sidebar-border)}
.sb-label{
  font-size:12px;font-weight:500;color:var(--muted-foreground);
  padding:0 0 10px;letter-spacing:.01em;
}
.sb-field + .sb-field{margin-top:12px}
.sb-row{display:flex;gap:8px}
.sb-row > *{flex:1 1 0;min-width:0}
.sb-row .sym{flex:0 0 64px;text-align:center}
.ct-row{display:flex;align-items:center;gap:5px}
.ct-row + .ct-row{margin-top:8px}
.ct-badge{width:22px;height:22px;flex:0 0 auto}
.ct-badge svg{width:22px;height:22px}
.ct-p{flex:0 0 84px;padding:0 20px 0 8px;background-position:right 4px center;background-size:13px}
.ct-v{flex:1 1 auto;min-width:0}
.ct-x{flex:0 0 26px;width:26px}
.mhint{position:fixed;z-index:60;display:flex;align-items:center;gap:10px;max-width:380px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);padding:6px 8px 6px 10px;font-size:13px}
.mhint .mh-txt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhint .mh-code{color:var(--muted-foreground)}
.mhint .mh-name{font-weight:600}
.mhint .mh-act{flex:0 0 auto;height:26px;padding:0 10px;font-size:12px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--background);cursor:pointer;
  color:var(--foreground);text-decoration:none;display:inline-flex;align-items:center}
.mhint .mh-act:hover{background:var(--accent)}
.sb-foot{padding:12px 16px;border-top:1px solid var(--sidebar-border);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-foot .span2{grid-column:1 / -1}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  height:60px;padding:0 24px;background:var(--background);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
}
.crumb{font-size:14px;font-weight:500}
.crumb span{color:var(--muted-foreground);font-weight:400}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{padding:24px;display:flex;flex-direction:column;gap:24px;max-width:1400px;width:100%}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{padding:18px 20px}
.stat-k{font-size:13px;color:var(--muted-foreground);font-weight:500}
.stat-v{font-size:28px;font-weight:600;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:860px}
table.tbl th{
  height:40px;padding:0 12px;text-align:left;vertical-align:middle;
  font-size:13px;font-weight:500;color:var(--muted-foreground);white-space:nowrap;
  border-bottom:1px solid var(--border);
}
table.tbl td{padding:6px 4px;vertical-align:middle;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl .cell{
  width:100%;height:32px;padding:0 8px;font-size:14px;min-width:0;
  border:1px solid transparent;border-radius:var(--r-sm);
  background:transparent;color:var(--foreground);
  transition:border-color .15s,box-shadow .15s,background-color .15s;
}
table.tbl .cell:hover{border-color:var(--input)}
table.tbl .cell:focus{outline:none;background:var(--background);border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-a)}
td.acts{text-align:right;white-space:nowrap}
.iconbtn{
  width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:var(--r-sm);background:transparent;
  color:var(--muted-foreground);cursor:pointer;transition:background-color .15s,color .15s;
}
.iconbtn svg{width:15px;height:15px}
.iconbtn:hover{background:var(--accent);color:var(--accent-foreground)}
.iconbtn.danger:hover{background:var(--destructive);color:#fff}
.iconbtn:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-a)}

/* empty state */
.empty{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  padding:44px 20px;border:1px dashed var(--border);border-radius:var(--r-lg);
}
.empty .ic{
  width:40px;height:40px;border-radius:var(--r-md);background:var(--muted);
  display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);margin-bottom:6px;
}
.empty .ic svg{width:19px;height:19px}
.empty h3{margin:0;font-size:14px;font-weight:600}
.empty p{margin:0;font-size:13px;color:var(--muted-foreground);max-width:340px}

/* swatches */
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{
  display:flex;align-items:center;gap:8px;padding:5px 8px;min-width:0;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--background);
}
.sw input[type=color]{
  width:20px;height:20px;flex:0 0 auto;padding:0;border:1px solid var(--border);
  border-radius:4px;background:none;cursor:pointer;
}
.sw span{font-size:12px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* range */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:140px;height:16px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:var(--muted)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;
  background:var(--background);border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
input[type=range]::-moz-range-track{height:5px;border-radius:999px;background:var(--muted)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--background);border:1px solid var(--border)}
.zoomval{font-family:var(--mono);font-size:12px;color:var(--muted-foreground);width:38px;text-align:right}

.preview-body{background:var(--muted);border-top:1px solid var(--border);
  border-radius:0 0 var(--r-xl) var(--r-xl);padding:24px;overflow:auto}

/* ═══ the printed tag — unchanged ═══ */
#sheet{margin:0 auto;font-family:var(--tag-font)}
.page{width:210mm;height:297mm;padding:8mm;background:var(--c-bg);display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);
  margin:0 auto 16px;box-shadow:0 4px 24px rgb(0 0 0 / .18)}
.cut .tag{outline:1px dashed #dcdcdc;outline-offset:-.5px}
.tag{padding:5mm 4.4mm 4mm;display:flex;flex-direction:column;overflow:hidden;break-inside:avoid;color:var(--c-spec)}
.tag-head{display:flex;align-items:center;gap:2.4mm}
.logo{width:8.5mm;height:8.5mm;border-radius:50%;flex:0 0 auto;background:var(--c-model);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:56%;height:56%;fill:#fff}
.store{font-size:calc(7.4pt * var(--fs));font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--c-brand);line-height:1.2}
.field{margin-top:5.5mm}
.field-label{font-size:calc(6pt * var(--fs));color:var(--c-meta);margin-bottom:.8mm}
.rule{border-bottom:1px solid var(--c-rule);min-height:5.4mm;display:flex;align-items:flex-end;padding-bottom:.6mm}
.rule .v{font-size:calc(9.2pt * var(--fs));color:var(--c-model);font-weight:600;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.chips{display:flex;gap:1.6mm;margin-top:2.6mm}
.chip{flex:1 1 0;min-width:0;border:1px solid var(--c-rule);border-radius:1mm;padding:1.1mm 1.2mm;display:flex;align-items:center;gap:.9mm}
.chip svg{width:2.6mm;height:2.6mm;flex:0 0 auto;fill:var(--c-spec);opacity:.75}
.cline{flex:1 1 auto;min-width:0;border-bottom:1px solid var(--c-rule);text-align:center;
  font-size:calc(6.6pt * var(--fs));color:var(--c-model);font-weight:600;line-height:1.4;overflow:hidden;white-space:nowrap}
.cu{font-size:calc(6pt * var(--fs));color:var(--c-spec);flex:0 0 auto;white-space:nowrap}
.spacer{flex:1 1 auto;min-height:2mm}
.price{display:flex;align-items:flex-end;gap:1.8mm}
.kip{font-size:calc(15pt * var(--fs));color:var(--c-price);line-height:1;font-weight:600;white-space:nowrap}
.price .rule{flex:1 1 auto;min-height:6.4mm}
.price .rule .v{font-size:calc(11.5pt * var(--fs));color:var(--c-price);font-weight:700;text-align:end}
.meta{margin-top:2.4mm;padding-bottom:.6mm;font-size:calc(5.6pt * var(--fs));color:var(--c-meta);
  border-bottom:1px dashed var(--c-rule);white-space:nowrap;overflow:hidden}
.meta .w{display:inline-block;min-width:7mm;text-align:center;color:var(--c-model);font-weight:600}
.contact{display:flex;align-items:center;gap:1.4mm 3mm;margin-top:2.2mm;flex-wrap:wrap}
.ci{display:flex;align-items:center;gap:1.1mm;font-size:calc(6.4pt * var(--fs));color:var(--c-contact);
  min-width:0;overflow:hidden;white-space:nowrap;direction:ltr}
.ci svg{width:3.1mm;height:3.1mm;flex:0 0 auto}
.tag[dir=rtl] .contact{justify-content:flex-end}

/* ═══ responsive ═══ */
@media (max-width:1024px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:0 0 auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--sidebar-border)}
  .sb-scroll{overflow:visible}
  .sb-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
  .sb-label{grid-column:1 / -1;padding-bottom:0}
  .sb-field + .sb-field{margin-top:0}
  .content{padding:16px;gap:16px}
  .stats{grid-template-columns:1fr;gap:12px}
  .topbar{padding:0 16px}
}

/* ═══ print ═══ */
@page{size:A4 portrait;margin:0}
@media print{
  .no-print{display:none !important}
  html,body{background:#fff !important;height:auto}
  .app,.main,.content,.card,.preview-body{
    display:block !important;padding:0 !important;margin:0 !important;gap:0 !important;
    border:0 !important;border-radius:0 !important;box-shadow:none !important;
    background:#fff !important;max-width:none !important;overflow:visible !important;
  }
  #sheet{zoom:1 !important;margin:0}
  .page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">

  <!-- ══════ sidebar ══════ -->
  <aside class="sidebar no-print">
    <div class="sb-brand">
      <div class="sb-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg></div>
      <div>
        <div class="sb-name" data-t="title">Price tags</div>
        <div class="sb-sub" data-t="sheetMeta">A4 · 12 per page</div>
      </div>
    </div>

    <div class="sb-scroll">
      <div class="sb-group">
        <div class="sb-label" data-t="language">Language</div>
        <div class="sb-field"><label class="label" data-t="tagLang">Tag language</label><select class="select" id="s_lang"></select></div>
        <div class="sb-field"><label class="label" data-t="uiLang">Menu language</label><select class="select" id="s_ui"></select></div>
        <div class="sb-field"><label class="label" data-t="currency">Currency</label><select class="select" id="s_curPre"></select></div>
        <div class="sb-field"><label class="label" data-t="curCustom">Symbol &amp; name</label>
          <div class="sb-row">
            <input class="input sym" type="text" id="s_curSym" maxlength="4" placeholder="₭">
            <input class="input" type="text" id="s_curName" maxlength="24" placeholder="ກີບ">
          </div>
        </div>
      </div>

      <div class="sb-group">
        <div class="sb-label" data-t="shop">Shop details</div>
        <div class="sb-field"><label class="label" data-t="storeName">Store name</label><input class="input" type="text" id="s_store"></div>
        <div class="sb-field"><label class="label" data-t="logoImage">Logo image</label>
          <div class="sb-row">
            <button class="btn btn-outline btn-sm" id="btnLogo" data-t="chooseFile">Choose file</button>
            <button class="btn btn-ghost btn-sm" id="btnLogoClear" data-t="reset">Reset</button>
          </div>
          <input type="file" id="fileLogo" accept="image/*" hidden>
        </div>
      </div>

      <div class="sb-group">
        <div class="sb-label" data-t="contacts">Contacts</div>
        <div id="contacts"></div>
        <div class="sb-field" style="margin-top:10px">
          <button class="btn btn-outline btn-sm" id="btnAddContact" data-t="addContact">Add contact</button>
        </div>
      </div>

      <div class="sb-group">
        <div class="sb-label" data-t="colors">Text colors</div>
        <div class="swatches" id="swatches"></div>
        <div class="sb-field" style="margin-top:10px">
          <button class="btn btn-ghost btn-sm" id="btnResetColors" data-t="resetColors">Reset colors</button>
        </div>
      </div>

      <div class="sb-group">
        <div class="sb-label" data-t="options">Sheet options</div>
        <div class="sb-field"><label class="label" data-t="sep">Thousands separator</label>
          <select class="select" id="s_sep">
            <option value=",">1,500,000</option><option value=".">1.500.000</option>
            <option value=" ">1 500 000</option><option value="">1500000</option>
          </select></div>
        <div class="sb-field"><label class="label" data-t="textSize">Text size</label>
          <select class="select" id="s_fs">
            <option value="0.9" data-t="small">Small</option>

function defaults(){
  return { settings:{
    lang:"lo", ui:"en", theme:"light", curSym:"", curName:"",
    store:"", logo:DEFAULT_LOGO, sep:",", fs:"1", cut:"1",

var state = load();
function T(){ return UI[state.settings.ui] || UI.en; }
function TL(){ return L[state.settings.lang] || L.en; }

function load(){
  try{ var r = localStorage.getItem(KEY); return r ? normalize(JSON.parse(r)) : defaults(); }
  catch(e){ return defaults(); }
}
function normalize(o){
  var d = defaults();
  if(!o || typeof o !== "object") return d;
  var s = o.settings || {};
  ["store","logo","sep","fs","cut","curSym","curName"].forEach(function(k){
    if(typeof s[k] === "string") d.settings[k] = s[k];
  });
  if(Array.isArray(s.contacts)){
    d.settings.contacts = s.contacts.filter(function(c){ return c && PLAT[c.p]; })
      .slice(0,MAX_CONTACTS).map(function(c){ return {p:c.p, v:str(c.v)}; });
  }else if(typeof s.phone === "string" || typeof s.fb === "string"){
    d.settings.contacts = [{p:"whatsapp",v:str(s.phone)},{p:"facebook",v:str(s.fb)}];
  }
  if(L[s.lang]) d.settings.lang = s.lang;
  if(UI[s.ui])  d.settings.ui = s.ui;
  if(s.theme === "dark" || s.theme === "light") d.settings.theme = s.theme;
  if(s.colors && typeof s.colors === "object"){
    COLOR_KEYS.forEach(function(p){
      var v = s.colors[p[0]];
      if(typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v)) d.settings.colors[p[0]] = v;
    });
  }
  d.entries = Array.isArray(o.entries) ? o.entries.map(cleanEntry) : [];
  return d;
}
function cleanEntry(e){
  e = e || {}; var q = parseInt(e.qty,10);
  return { id:e.id||uid(), model:str(e.model), gb:str(e.gb), ram:str(e.ram), mah:str(e.mah),
           price:str(e.price), warranty:str(e.warranty), qty:(isNaN(q)||q<1)?1:Math.min(q,999) };
}
function str(v){ return typeof v==="string" ? v : (v==null ? "" : String(v)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

var saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} },200);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function money(v,sep){
  var t = String(v).trim(); if(!t) return "";
  if(!/^[\d\s.,]+$/.test(t)) return t;
  var d = t.replace(/\D/g,""); if(!d) return t;
  return sep === "" ? d : d.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
}

    COLS.forEach(function(c){
      h += '<td><input class="cell" type="'+c[1]+'" data-k="'+c[0]+'" value="'+esc(e[c[0]])+
           '" placeholder="'+esc(c[2])+'"'+(c[0]==="qty"?' min="1" max="999"':'')+'></td>';
    });
    h += '<td class="acts">'+
      '<button class="iconbtn" data-a="up">'+UICON.up+'</button>'+
      '<button class="iconbtn" data-a="down">'+UICON.down+'</button>'+
      '<button class="iconbtn" data-a="dup">'+UICON.copy+'</button>'+
      '<button class="iconbtn danger" data-a="del">'+UICON.trash+'</button></td></tr>';
  });
  $("rows").innerHTML = h;
  var none = state.entries.length === 0;
  $("emptyState").hidden = !none;
  $("tblWrap").hidden = none;
}

/* ══ chrome ══ */
function buildSelects(){
  $("s_lang").innerHTML = Object.keys(L).map(function(k){ return '<option value="'+k+'">'+esc(L[k].n)+'</option>'; }).join("");
  $("s_ui").innerHTML   = Object.keys(UI).map(function(k){ return '<option value="'+k+'">'+esc(UI[k].n)+'</option>'; }).join("");
  $("s_curPre").innerHTML = '<option value="">—</option>' + CUR.map(function(c,i){
    return '<option value="'+i+'">'+esc(c[0]+"  "+c[1]+"  "+c[2])+'</option>'; }).join("");
}
function syncCurPreset(){
  var st = state.settings, hit = "";
  CUR.forEach(function(c,i){ if(c[1]===st.curSym && c[2]===st.curName) hit = String(i); });
  $("s_curPre").value = hit;
}
function renderContacts(){
  var cs = state.settings.contacts;
  $("contacts").innerHTML = cs.map(function(c,i){
    var opts = PLAT_ORDER.map(function(k){
      return '<option value="'+k+'"'+(k===c.p?' selected':'')+'>'+esc(platName(k))+'</option>';
    }).join("");
    return '<div class="ct-row" data-i="'+i+'">'+
      '<span class="ct-badge">'+PLAT[c.p].ic+'</span>'+
      '<select class="select ct-p">'+opts+'</select>'+
      '<input class="input ct-v" type="text" value="'+esc(c.v)+'" placeholder="'+esc(platPh(c.p))+'">'+
      '<button class="iconbtn danger ct-x" title="remove">'+UICON.trash+'</button>'+
    '</div>';
  }).join("");
  $("btnAddContact").disabled = cs.length >= MAX_CONTACTS;
}

function renderSwatches(){
  var t = T();
  $("swatches").innerHTML = COLOR_KEYS.map(function(p){
    return '<label class="sw"><input type="color" data-v="'+p[0]+'" value="'+
      state.settings.colors[p[0]]+'"><span>'+esc(t[p[1]])+'</span></label>';
  }).join("");
}
function applyUI(){
  var t = T();
  document.querySelectorAll("[data-t]").forEach(function(el){ if(t[el.dataset.t]) el.textContent = t[el.dataset.t]; });
  $("btnTheme").title = t.theme;
  $("s_store").placeholder = t.ph_store;
  renderSwatches(); renderContacts();
}
function applyTheme(){
  var dark = state.settings.theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("btnTheme").innerHTML = dark ? UICON.sun : UICON.moon;
}
function applySettings(){
  var st = state.settings, r = document.documentElement.style;
  COLOR_KEYS.forEach(function(p){ r.setProperty(p[0], st.colors[p[0]]); });
  r.setProperty("--fs", st.fs);
  $("s_lang").value = st.lang; $("s_ui").value = st.ui;
  $("s_curSym").value = st.curSym; $("s_curName").value = st.curName;
  $("s_store").value = st.store;
  $("s_sep").value = st.sep; $("s_fs").value = st.fs; $("s_cut").value = st.cut;
  syncCurPreset(); applyTheme();
}

var drawTimer;
function redraw(now){
  clearTimeout(drawTimer);
  if(now){ renderSheet(); save(); return; }
  drawTimer = setTimeout(function(){ renderSheet(); save(); },150);
}

/* ══ events ══ */
$("rows").addEventListener("input", function(ev){
  var inp = ev.target.closest("input"); if(!inp) return;
  var i = +inp.closest("tr").dataset.i, k = inp.dataset.k;
  if(k === "qty"){ var q = parseInt(inp.value,10); state.entries[i].qty = (isNaN(q)||q<1)?1:Math.min(q,999); }
  else state.entries[i][k] = inp.value;
  redraw();
});
$("rows").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-a]"); if(!b) return;
  var i = +b.closest("tr").dataset.i, a = b.dataset.a, E = state.entries;
  if(a==="del") E.splice(i,1);
  if(a==="dup") E.splice(i+1,0,cleanEntry(Object.assign({},E[i],{id:uid()})));
  if(a==="up" && i>0) E.splice(i-1,0,E.splice(i,1)[0]);
  if(a==="down" && i<E.length-1) E.splice(i+1,0,E.splice(i,1)[0]);
  renderList(); redraw(true);
});
$("btnAdd").addEventListener("click", function(){
  state.entries.push(cleanEntry({})); renderList(); redraw(true);
  var last = $("rows").querySelector("tr:last-child input"); if(last) last.focus();
});
$("btnTheme").addEventListener("click", function(){
  state.settings.theme = state.settings.theme === "dark" ? "light" : "dark";
  applyTheme(); save();
});
$("s_lang").addEventListener("change", function(){ state.settings.lang = this.value; redraw(true); });
$("s_ui").addEventListener("change", function(){ state.settings.ui = this.value; applyUI(); redraw(true); });
$("s_curPre").addEventListener("change", function(){
  var c = CUR[+this.value]; if(!c) return;
  state.settings.curSym = c[1]; state.settings.curName = c[2];
  $("s_curSym").value = c[1]; $("s_curName").value = c[2]; redraw(true);
});
$("s_curSym").addEventListener("input", function(){ state.settings.curSym = this.value; syncCurPreset(); redraw(); });
$("s_curName").addEventListener("input", function(){ state.settings.curName = this.value; syncCurPreset(); redraw(); });
$("s_store").addEventListener("input", function(){ state.settings.store = this.value; redraw(); });

$("contacts").addEventListener("input", function(ev){
  var inp = ev.target.closest(".ct-v"); if(!inp) return;
  state.settings.contacts[+inp.closest(".ct-row").dataset.i].v = inp.value;
  redraw();
});
$("contacts").addEventListener("change", function(ev){
  var sel = ev.target.closest(".ct-p"); if(!sel) return;
  var row = sel.closest(".ct-row"), i = +row.dataset.i;
  state.settings.contacts[i].p = sel.value;
  row.querySelector(".ct-badge").innerHTML = PLAT[sel.value].ic;
  row.querySelector(".ct-v").placeholder = platPh(sel.value);
  redraw(true);
});
$("contacts").addEventListener("click", function(ev){
  var b = ev.target.closest(".ct-x"); if(!b) return;
  state.settings.contacts.splice(+b.closest(".ct-row").dataset.i, 1);
  renderContacts(); redraw(true);
});
$("btnAddContact").addEventListener("click", function(){
  var cs = state.settings.contacts;
  if(cs.length >= MAX_CONTACTS) return;
  var used = cs.map(function(c){ return c.p; });
  var next = PLAT_ORDER.filter(function(k){ return used.indexOf(k) < 0; })[0] || "whatsapp";
  cs.push({p:next, v:""});
  renderContacts(); redraw(true);
  var last = $("contacts").querySelector(".ct-row:last-child .ct-v"); if(last) last.focus();
});
$("s_sep").addEventListener("change", function(){ state.settings.sep = this.value; redraw(true); });
$("s_cut").addEventListener("change", function(){ state.settings.cut = this.value; redraw(true); });
$("s_fs").addEventListener("change", function(){
  state.settings.fs = this.value;
  document.documentElement.style.setProperty("--fs", this.value); save();
});
$("swatches").addEventListener("input", function(ev){
  var inp = ev.target.closest("input[type=color]"); if(!inp) return;
  state.settings.colors[inp.dataset.v] = inp.value;
  document.documentElement.style.setProperty(inp.dataset.v, inp.value); save();
});
$("btnResetColors").addEventListener("click", function(){
  state.settings.colors = Object.assign({},DEFAULT_COLORS);
  applySettings(); renderSwatches(); save();
});
$("btnLogo").addEventListener("click", function(){ $("fileLogo").click(); });
$("fileLogo").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  if(f.size > 1200000){ alert(T().logoTooBig); this.value=""; return; }
  var fr = new FileReader();
  fr.onload = function(){ state.settings.logo = fr.result; redraw(true); };
  fr.readAsDataURL(f); this.value = "";
});
$("btnLogoClear").addEventListener("click", function(){ state.settings.logo = DEFAULT_LOGO; redraw(true); });
$("btnExport").addEventListener("click", function(){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
  a.download = "price-tags-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
});
$("btnImport").addEventListener("click", function(){ $("fileImport").click(); });
$("fileImport").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){ try{ state = normalize(JSON.parse(fr.result)); boot(); } catch(e){ alert(T().badFile); } };
  fr.readAsText(f); this.value = "";
});
$("btnClear").addEventListener("click", function(){
  if(!confirm(T().confirmClear)) return;
  var keep = { ui:state.settings.ui, theme:state.settings.theme };
  state = defaults(); state.settings.ui = keep.ui; state.settings.theme = keep.theme; boot();
});
$("zoom").addEventListener("input", function(){
  $("sheet").style.zoom = this.value/100; $("zoomVal").textContent = this.value+"%";
});
$("btnPrint").addEventListener("click", function(){ window.print(); });

/* ══ model code resolver ══ */
var hintTimer, hintRow = -1;
function hideHint(){ hintRow = -1; $("mhint").hidden = true; }
function showHint(inp){
  var tr = inp.closest("tr"), i = +tr.dataset.i, q = inp.value.trim(), t = T(), box = $("mhint");
  if(!looksLikeCode(q)){ hideHint(); return; }
  var name = lookupModel(q);
  if(name && normCode(name) === normCode(q)){ hideHint(); return; }
  hintRow = i;
  box.innerHTML = name
    ? '<span class="mh-txt"><span class="mh-code">'+esc(q)+'</span> &rarr; <span class="mh-name">'+esc(name)+'</span></span>'+
      '<button type="button" class="mh-act" data-use="'+esc(name)+'">'+esc(t.useName)+'</button>'
    : '<span class="mh-txt mh-code">'+esc(t.noMatch)+'</span>'+
      '<a class="mh-act" target="_blank" rel="noopener" href="https://www.google.com/search?q='+
        encodeURIComponent(q+" phone model")+'">'+esc(t.searchWeb)+' \u2197</a>';
  var r = inp.getBoundingClientRect();
  box.hidden = false;
  var w = box.offsetWidth;
  box.style.top  = Math.min(r.bottom + 6, innerHeight - box.offsetHeight - 8) + "px";
  box.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
}
function applyModel(i, name){
  state.entries[i].model = name;
  var inp = $("rows").querySelector('tr[data-i="'+i+'"] input[data-k="model"]');
  if(inp) inp.value = name;
  hideHint(); redraw(true);
}
$("rows").addEventListener("input", function(ev){
  var inp = ev.target.closest('input[data-k="model"]'); if(!inp) return;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ showHint(inp); }, 250);
});
$("rows").addEventListener("keydown", function(ev){
  var inp = ev.target.closest('input[data-k="model"]'); if(!inp) return;
  if(ev.key === "Escape"){ hideHint(); return; }
  if(ev.key !== "Enter") return;
  var name = lookupModel(inp.value.trim());
  if(name){ ev.preventDefault(); applyModel(+inp.closest("tr").dataset.i, name); }
});
$("rows").addEventListener("focusout", function(ev){
  if(ev.target.closest('input[data-k="model"]')) setTimeout(hideHint, 180);
});
$("mhint").addEventListener("mousedown", function(ev){
  var b = ev.target.closest("[data-use]"); if(!b || hintRow < 0) return;
  ev.preventDefault(); applyModel(hintRow, b.dataset.use);
});
addEventListener("scroll", hideHint, true);
addEventListener("resize", hideHint);

function boot(){ applySettings(); applyUI(); renderList(); renderSheet(); hideHint(); }
buildSelects();
boot();
$("sheet").style.zoom = 0.6;

})();
</script>
</body>
